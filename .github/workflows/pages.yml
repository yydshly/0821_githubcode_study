name: Deploy research gallery to Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "projects/moovie-video-playback/lab/**"
      - "projects/moovie-video-playback/upstream"
      - ".gitmodules"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Assemble Pages artifact
        shell: bash
        run: |
          mkdir -p _site/demos/moovie-video-playback _site/demos/upstream
          cp -R docs/. _site/
          cp -R projects/moovie-video-playback/lab/. _site/demos/moovie-video-playback/
          cp -R projects/moovie-video-playback/upstream/v4.0.0 _site/demos/upstream/v4.0.0

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
